# Keyless generic ACP v1 control-surface patch over `neosis --profile acp`.

- id: llm-deepseek
  name: '@averqel/neosis-llm-deepseek-api-key'
  disabled: true

- id: acp
  name: '@averqel/neosis-acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@averqel/neosis-session-persistence-jsonl'
  config:
    root: !!js process.env.NEOSIS_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
