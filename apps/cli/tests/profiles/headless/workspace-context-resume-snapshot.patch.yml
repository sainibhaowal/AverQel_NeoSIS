# Patch for resuming one seeded workspace-instruction session over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-instructions
  config:
    maxBytes: 65536
    neosisHome: !!js process.cwd() + '/.neosis'

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: replay
      name: '@averqel/neosis-llm-replay'
      config:
        file: !!js process.env.NEOSIS_SNAPSHOT_FILE
        overrideFile: !!js process.env.NEOSIS_SNAPSHOT_OVERRIDE

    # Publish the persisted agent before the driver selects the single root.
    - id: resumed-agent
      name: './tests/fixtures/workspace-context-resume-agent.ts'

- id: session-log-deepseek
  config:
    enabled: false
