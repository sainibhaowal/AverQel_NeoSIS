# Keyless session-title composition. Main-agent chunks derive from session.jsonl;
# the auxiliary route consumes replay.override.json with pacing so its accepted
# title commits only after the main turn has closed.
- id: llm-deepseek
  name: '@averqel/neosis-llm-deepseek'
  disabled: true

- id: agent-default-model
  name: '@averqel/neosis-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@averqel/neosis-session-persistence-jsonl'
  config:
    root: !!js neosisHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@averqel/neosis-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@averqel/neosis-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay-main
      name: '@averqel/neosis-llm-replay'
      config:
        overrideFile: ./.missing-main-replay-override.json
        providers:
          - id: deepseek-official
            name: AverQel
            models:
              - id: deepseek-v4-flash
    - id: llm-replay-title
      name: '@averqel/neosis-llm-replay'
      config:
        paceMs: 10
        providers:
          - id: title-replay
            name: Title replay
            models:
              - id: title-model
    - id: session-title-provider
      name: '@averqel/neosis-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: title-replay
        model: title-model
