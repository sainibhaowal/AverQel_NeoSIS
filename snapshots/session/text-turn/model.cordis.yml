# The recorded request header selects the replay route. This keeps model
# selection in session JSONL instead of duplicating it across manifests.

- id: agent-default-model
  name: '@averqel/neosis-agent-default-model'
  config:
    provider: !!js process.env.NEOSIS_SNAPSHOT_PROVIDER
    model: !!js process.env.NEOSIS_SNAPSHOT_MODEL
