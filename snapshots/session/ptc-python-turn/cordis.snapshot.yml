# Keyless Python PTC composition through the real headless Loader.
- id: llm-deepseek
  name: '@averqel/neosis-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: agent-default-model
  name: '@averqel/neosis-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@averqel/neosis-session-persistence-jsonl'
  config:
    root: !!js neosisHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@averqel/neosis-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@averqel/neosis-tools'
  config:
    mode: ptc

- id: ptc-runtime
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- insert:
    - id: ptc-runtime-python
      name: '@averqel/neosis-experimental-ptc-runtime-python'

- id: system-prompt
  name: '@averqel/neosis-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@averqel/neosis-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
