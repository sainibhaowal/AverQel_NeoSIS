[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "averqel-neosis-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled neosis CLI runtime for the AverQel NeoSIS Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Mehil Krring" }]

[project.urls]
Homepage = "https://github.com/sainibhaowal/AverQel_Neosis"
Documentation = "https://github.com/sainibhaowal/AverQel_Neosis/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/sainibhaowal/AverQel_Neosis/issues"
Source = "https://github.com/sainibhaowal/AverQel_Neosis"

[project.scripts]
neosis = "averqel_neosis_runtime:main"

# Include the injected neosis executable and runtime sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/averqel_neosis_runtime/runtime/averqel-neosis-sdk-runtime-*",
  "src/averqel_neosis_runtime/runtime/averqel-neosis-sdk-runtime-*/**",
  "src/averqel_neosis_runtime/runtime/linux-*/**",
  "src/averqel_neosis_runtime/runtime/macos-*/**",
  "src/averqel_neosis_runtime/runtime/win-*/**",
]
exclude = ["src/averqel_neosis_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/averqel_neosis_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
