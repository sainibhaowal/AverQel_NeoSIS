[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "averqel-neosis-sdk"
version = "0.0.0.dev0"
description = "Python SDK for AverQel NeoSIS"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Mehil Krring" }]
dependencies = [
  "pydantic>=2.12,<3",
  "averqel-neosis-runtime-bin==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/sainibhaowal/AverQel_Neosis"
Documentation = "https://github.com/sainibhaowal/AverQel_Neosis/blob/master/docs/user/guide/python-sdk.md"
Issues = "https://github.com/sainibhaowal/AverQel_Neosis/issues"
Source = "https://github.com/sainibhaowal/AverQel_Neosis"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/averqel_neosis"]

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
averqel-neosis-runtime-bin = { path = "../sdk-runtime", editable = true }
